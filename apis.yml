name: Price Lab
description: >-
  Price Lab (Price Lab Solutions) is a Latin American retail pricing intelligence
  platform that helps retailers and e-commerce merchants monitor competitor prices,
  analyze pricing KPIs, and apply AI-driven price optimization across their catalog
  and store network. The platform pairs competitor price scraping and competitive
  pricing policies with a recommendation engine, bulk data ingestion (sales, stock,
  replenishment, offers, and competitor prices), and electronic shelf label (ESL)
  management with flash strategies. Its production REST API, documented at
  price-lab.readme.io and hosted at backend.pricelab.com.pe, exposes product and
  category master data, batch price and cost updates, competitor price exports,
  recommendation accept/reject flows, and store-level price management, all secured
  with JWT bearer authentication.
